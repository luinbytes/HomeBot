name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run -p homebot-protocol --example export_schema -- --check
      - run: cargo run -p homebot-protocol --example export_android -- --check

  rust-build:
    name: Rust build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --target ${{ matrix.target }}

  visual-regression:
    name: Visual goldens (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-15-intel
            platform: macOS Intel
          - os: macos-14
            platform: macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-${{ matrix.platform }}
      - run: cargo test -p homebot-desktop --all-features --test visual_goldens

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          # Cargo locks SQLx's unselected optional MySQL/RSA graph. HomeBot enables
          # SQLite only; the reproducible check below proves rsa is unreachable.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0192
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: test -z "$(cargo tree | grep -E '(^| )rsa v')"

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  android-quality:
    name: Android quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Lint, test, and assemble Android
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBot-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos-package:
    name: macOS package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: Intel
          - os: macos-14
            target: aarch64-apple-darwin
            arch: Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p homebot-desktop -p homebot-server
      - name: Assemble and verify application bundle
        env:
          HOMEBOT_TARGET: ${{ matrix.target }}
          HOMEBOT_VERSION: 0.0.1-ci
          HOMEBOT_BUILD_VERSION: ${{ github.run_number }}
          SOURCE_DATE_EPOCH: 1704067200
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBot-macOS-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*-notarization.zip
            dist/*.manifest.json
            dist/*.SHA256SUMS
          if-no-files-found: error
