name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run -p homebot-protocol --example export_schema -- --check
      - run: cargo run -p homebot-protocol --example export_android -- --check
      - run: ./scripts/security-gate.sh
      - run: ./scripts/performance-accessibility-gate.sh

  rust-build:
    name: Rust build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --target ${{ matrix.target }}

  visual-regression:
    name: Visual goldens (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-15-intel
            platform: macOS Intel
          - os: macos-14
            platform: macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-${{ matrix.platform }}
      - run: cargo test -p homebot-desktop --all-features --test visual_goldens

  performance-resource:
    name: Performance/resource (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-15-intel
            platform: macOS-Intel
          - os: macos-14
            platform: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: performance-${{ matrix.platform }}
      - run: ./scripts/performance-accessibility-gate.sh
      - run: cargo build --release -p homebot-server
      - run: ./scripts/process-resource-budget.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          # Cargo locks SQLx's unselected optional MySQL/RSA graph. HomeBot enables
          # SQLite only; the reproducible check below proves rsa is unreachable.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0192
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: test -z "$(cargo tree | grep -E '(^| )rsa v')"

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  android-quality:
    name: Android quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Lint, test, and assemble Android
        working-directory: android
        run: >-
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
          -PhomebotVersionName=1.0.0 -PhomebotVersionCode=1000000 --stacktrace
      - name: Exercise signed Android release packaging with CI-only key
        env:
          HOMEBOT_VERSION: 1.0.0
          HOMEBOT_ANDROID_SIGNING: ci-ephemeral
        run: |
          export HOMEBOT_CI_KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/homebot-ci.keystore" \
            -storepass:env HOMEBOT_CI_KEY_PASSWORD -keypass:env HOMEBOT_CI_KEY_PASSWORD \
            -alias homebot-ci -keyalg RSA -keysize 2048 \
            -validity 1 -dname 'CN=HomeBot CI only,OU=Not for release,O=HomeBot,C=US'
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/homebot-ci.keystore" \
            --ks-pass env:HOMEBOT_CI_KEY_PASSWORD --key-pass env:HOMEBOT_CI_KEY_PASSWORD \
            --out "$RUNNER_TEMP/HomeBot-ci-signed.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          scripts/package-android.sh "$RUNNER_TEMP/HomeBot-ci-signed.apk" android/app/build/release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBot-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBot-Android-release-pipeline-ci-only
          path: android/app/build/release-dist/*
          if-no-files-found: error

  macos-package:
    name: macOS package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: Intel
          - os: macos-14
            target: aarch64-apple-darwin
            arch: Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p homebot-desktop -p homebot-server
      - name: Assemble and verify application bundle
        env:
          HOMEBOT_TARGET: ${{ matrix.target }}
          HOMEBOT_VERSION: 0.0.1-ci
          HOMEBOT_BUILD_VERSION: ${{ github.run_number }}
          SOURCE_DATE_EPOCH: 1704067200
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBot-macOS-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*-notarization.zip
            dist/*.manifest.json
            dist/*.SHA256SUMS
          if-no-files-found: error

  arch-package:
    name: Arch package install/update/uninstall
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch build and verification dependencies
        run: >-
          pacman -Syu --noconfirm --needed rustup git python curl procps-ng desktop-file-utils systemd dbus fontconfig
          libx11 libxcursor libxi libxkbcommon libxrandr mesa wayland
      - uses: actions/checkout@v4
      - name: Configure Rust and unprivileged package builder
        run: |
          rustup default stable
          useradd --create-home builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Create source archive and packages
        run: |
          version=0.0.1
          mkdir -p packaging/arch/dist
          git archive --format=tar.gz --prefix="HomeBot-$version/" HEAD > "packaging/arch/HomeBot-$version.tar.gz"
          source_sha=$(sha256sum "packaging/arch/HomeBot-$version.tar.gz" | cut -d' ' -f1)
          runuser -u builder -- ./scripts/render-arch-pkgbuild.sh "$version" "$source_sha" 1 packaging/arch/PKGBUILD
          runuser -u builder -- sh -c 'cd packaging/arch && makepkg --cleanbuild --force --noconfirm'
          mv packaging/arch/homebot-0.0.1-1-x86_64.pkg.tar.zst packaging/arch/dist/
          runuser -u builder -- ./scripts/render-arch-pkgbuild.sh "$version" "$source_sha" 2 packaging/arch/PKGBUILD
          runuser -u builder -- sh -c 'cd packaging/arch && makepkg --force --noconfirm'
          mv packaging/arch/homebot-0.0.1-2-x86_64.pkg.tar.zst packaging/arch/dist/
      - name: Verify clean install, update, and uninstall
        run: >-
          ./scripts/verify-arch-package.sh
          packaging/arch/dist/homebot-0.0.1-1-x86_64.pkg.tar.zst
          packaging/arch/dist/homebot-0.0.1-2-x86_64.pkg.tar.zst
      - name: Create checksums and manifest
        run: |
          cd packaging/arch/dist
          sha256sum *.pkg.tar.zst > HomeBot-0.0.1-arch-x86_64.SHA256SUMS
          cd ../../..
          python3 scripts/release-manifest.py \
            --output packaging/arch/dist/HomeBot-0.0.1-arch-x86_64.manifest.json \
            --artifact packaging/arch/dist/homebot-0.0.1-2-x86_64.pkg.tar.zst \
            --platform linux --architecture x86_64 --version 0.0.1 --signing unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBot-Arch-x86_64
          path: |
            packaging/arch/dist/*
            packaging/arch/PKGBUILD
          if-no-files-found: error
