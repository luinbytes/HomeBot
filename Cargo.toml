[workspace]
resolver = "2"
members = [
  "crates/homebot-domain",
  "crates/homebot-protocol",
  "crates/homebot-storage",
  "crates/homebot-server",
  "crates/homebot-providers",
  "crates/homebot-plugins",
  "crates/homebot-routines",
  "crates/homebot-skills",
  "crates/homebot-secrets",
  "crates/homebot-tools",
  "crates/homebot-vcs",
  "crates/homebot-desktop",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/luinbytes/HomeBot"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
cap-std = "4.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
egui = "0.32.3"
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
ed25519-dalek = "2.2"
futures-util = "0.3"
getrandom = "0.3"
homebot-domain = { version = "=1.0.0", path = "crates/homebot-domain" }
homebot-protocol = { version = "=1.0.0", path = "crates/homebot-protocol" }
homebot-providers = { version = "=1.0.0", path = "crates/homebot-providers" }
homebot-plugins = { version = "=1.0.0", path = "crates/homebot-plugins" }
homebot-routines = { version = "=1.0.0", path = "crates/homebot-routines" }
homebot-skills = { version = "=1.0.0", path = "crates/homebot-skills" }
homebot-tools = { version = "=1.0.0", path = "crates/homebot-tools" }
homebot-vcs = { version = "=1.0.0", path = "crates/homebot-vcs" }
homebot-secrets = { version = "=1.0.0", path = "crates/homebot-secrets" }
keyring = { version = "=3.6.3", default-features = false }
notify-rust = "4.18.0"
schemars = { version = "1.0", features = ["uuid1"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "uuid", "json"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
url = "2.5"
zeroize = "1.8"
portable-pty = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
