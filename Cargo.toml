[workspace]
resolver = "2"
members = [
  "crates/homebot-domain",
  "crates/homebot-protocol",
  "crates/homebot-storage",
  "crates/homebot-server",
  "crates/homebot-providers",
  "crates/homebot-tools",
  "crates/homebot-vcs",
  "crates/homebot-desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/luinbytes/HomeBot"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
futures-util = "0.3"
homebot-domain = { version = "=0.0.1", path = "crates/homebot-domain" }
homebot-protocol = { version = "=0.0.1", path = "crates/homebot-protocol" }
schemars = { version = "1.0", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid", "json"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
